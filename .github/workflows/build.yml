name: Build and Package

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        default: 'Release'
        required: true
        type: choice
        options:
        - Release
        - Debug

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore KuchiPaku.sln

    - name: Build and Publish
      run: |
        dotnet publish KuchiPaku/KuchiPaku.csproj -c ${{ github.event.inputs.configuration }} -r win-x64 --self-contained false /p:PublishSingleFile=true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KuchiPaku-Binary
        path: KuchiPaku/bin/${{ github.event.inputs.configuration }}/net9.0-windows10.0.18362.0/win-x64/_publish/*.zip
        if-no-files-found: error
